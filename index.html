<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Weather App - Live Weather Forecast</title>

    <meta name="description"
      content="Check live weather information for any city with our simple weather app.">

    <meta name="keywords"
      content="weather app, live weather, weather forecast, temperature">
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <form class="weatherform">
        <input type="text" class="cityinput" placeholder="Enter City">
        <button type="submit">Get Weather</button>
    </form>
    <div class="card">
        <h1 class="citydisplay"></h1>
        <p class="tempdisplay"></p>
        <p class="humiditydisplay"></p>
        <p class="descdisplay"></p>
        <p class="weatheremoji"></p>
        <p class="errordisplay">Please enter a City</p>

    </div>
    <script src="weather.js"></script>
</body>
</html>
